<!DOCTYPE html>
<html lang="java">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <title>Twitter(X)検索コマンド生成</title>
</head>

<body>
  <style>
    .container {
      width: 80%;
    }

    .form-group {
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .form-check {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    label {
      white-space: nowrap;
    }

    .validation {
      display: none;
    }

    .fa-exclamation {
      color: #DC3545;
    }

    @media (max-width:576px) {
      .container {
        width: 90%;
      }

      .validation {
        display: block;
        font-size: 80%;
      }

      .longPlaceholder::placeholder {
        color: transparent
      }
    }
  </style>

  <div class="d-flex justify-content-center">
    <span class="pageTitle h1 mt-2 mb-4">Twitter(X)検索コマンド生成</span>
  </div>


  <form th:action="@{/createTwitterCommand}" th:object="${form}" method="post">
    <div class="container">
      <div class="form-group row">
        <label class="userName col-sm-3 col-form-label text-wrap">ユーザー名<br><span
            class="validation">※半角英数字とアンダーバーのみ&nbsp;15文字以内</span></label>
        <div class="col-sm-9">
          <div class="input-group">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input type="text" maxlength="50" placeholder="半角英数字と「_」のみ 15文字以内" class="form-control longPlaceholder"
              th:classappend="${#fields.hasErrors('userName')}? 'is-invalid'" aria-describedby="basic-addon1"
              th:field="*{userName}" data-reset>
            <div th:if="${#fields.hasErrors('userName')}" class="invalid-feedback">
              <i class="fa-solid fa-exclamation"></i>
              <span th:errors="*{userName}"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group row">
        <label class="date col-sm-3 col-form-label">期間</label>
        <div class="col-sm-9">
          <div class="row">
            <div class="col-5">
              <input type="date" class="dateSince form-control"
                th:classappend="${!#strings.isEmpty(compareDate)}? 'is-invalid'" th:field="*{dateSince}" data-reset>
              <div th:if="${!#strings.isEmpty(compareDate)}" class="invalid-feedback">
                <i class="fa-solid fa-exclamation"></i>
                <span th:text="${compareDate}"></span>
              </div>
            </div>

            <label class="date col-2 col-form-label text-center">～</label>
            <div class="col-5">
              <input type="date" class="dateUntil form-control" th:field="*{dateUntil}" data-reset>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group row">
        <label class="keyword col-sm-3 col-form-label text-wrap">キーワード（完全一致）</label>
        <div class="col-sm-9">
          <input type="text" maxlength="20" placeholder="20文字以内" class="form-control"
            th:classappend="${#fields.hasErrors('keyword')}? 'is-invalid'" th:field="*{keyword}" data-reset>
          <div th:if="${#fields.hasErrors('keyword')}" class="invalid-feedback">
            <i class="fa-solid fa-exclamation"></i>
            <span th:errors="*{keyword}"></span>
          </div>
        </div>
      </div>

      <div class="form-check form-switch">
        <input type="checkbox" role="switch" class="followee form-check-input" value="followee" th:id="followee"
          th:field="*{followee}" data-reset>
        <label class="form-check-label" for="followee">フォローしている人の投稿のみ表示</label>
      </div>

      <div class="form-check form-switch mb-3">
        <input type="checkbox" role="switch" class="pictures form-check-input" value="pictures" th:id="pictures"
          th:field="*{pictures}" data-reset>
        <label class="form-check-label" for="pictures">画像投稿のみ表示</label>
      </div>

      <div class="form-group">
        <div class="accordion" id="moreOption">
          <div class="accordion-item">
            <h5 class="accordion-header">
              <button class="accordion-button collapsed text-center" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapse" aria-expanded="false" aria-controls="collapse">
                <i class="fa-solid fa-plus"></i>
                <span>&nbsp;さらに条件を追加</span>
              </button>
            </h5>
            <div id="collapse" class="accordion-collapse collapse" data-bs-parent="#moreOption">
              <div class="accordion-body">
                <div class="form-group row">
                  <label class="keyword col-sm-3 col-form-label text-wrap">除外するキーワード（完全一致）</label>
                  <div class="col-sm-9">
                    <input type="text" maxlength="20" placeholder="20文字以内" class="form-control"
                      th:classappend="${#fields.hasErrors('removeKeyword')}? 'is-invalid'" th:field="*{removeKeyword}"
                      data-reset>
                    <div th:if="${#fields.hasErrors('removeKeyword')}" class="invalid-feedback">
                      <i class="fa-solid fa-exclamation"></i>
                      <span th:errors="*{removeKeyword}"></span>
                    </div>
                  </div>
                </div>

                <div class="form-group row">
                  <label class="faves col-sm-3 col-form-label">いいね数</label>
                  <div class="col-sm-9">
                    <div class="row">
                      <div class="col-5">
                        <input type="number" min="0" class="minFaves form-control d-inline"
                          th:classappend="${!#strings.isEmpty(compareFaves)}? 'is-invalid'" th:field="*{minFaves}"
                          data-reset>
                        <div th:if="${!#strings.isEmpty(compareFaves)}" class="invalid-feedback">
                          <i class="fa-solid fa-exclamation"></i>
                          <span th:text="${compareFaves}"></span>
                        </div>
                      </div>
                      <label class="faves col-2 col-form-label text-center">～</label>
                      <div class="col-5">
                        <input type="number" min="0" class="maxFaves form-control d-inline" th:field="*{maxFaves}"
                          data-reset>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="form-group row">
                  <label class="userName col-sm-3 col-form-label text-wrap">特定ユーザー宛ての返信<br><span
                      class="validation">※半角英数字とアンダーバーのみ&nbsp;15文字以内</span></label>
                  <div class="col-sm-9">
                    <div class="input-group">
                      <span class="input-group-text" id="basic-addon2">@</span>
                      <input type="text" maxlength="50" placeholder="半角英数字と「_」のみ 15文字以内"
                        class="form-control longPlaceholder"
                        th:classappend="${#fields.hasErrors('reply')}? 'is-invalid'" aria-describedby="basic-addon2"
                        th:field="*{reply}" data-reset>
                      <div th:if="${#fields.hasErrors('reply')}" class="invalid-feedback">
                        <i class="fa-solid fa-exclamation"></i>
                        <span th:errors="*{reply}"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>


        <div class="form-group row mb-5">
          <input type="button" class="btn btn-danger col-5 mx-auto" id="resetButton" value="条件をリセット">
          <input type="submit" class="btn btn-primary col-5 mx-auto" name="generateCommand" value="コマンドを生成">
        </div>

        <div class="form-group">
          <div class="d-flex mb-2">
            <label class="h5">結果</label>
            <div class="ms-auto d-flex gap-2">
              <button type="button" class="btn btn-warning btn-sm" id="favButton">
                <i class="fa-solid fa-star"></i>
                <span>お気に入り登録</span>
              </button>
              <button type="button" class="btn btn-light btn-sm" id="copyButton">
                <i class="fa-solid fa-copy"></i>
                <span>コピー</span>
              </button>
            </div>
          </div>
          <div>
            <textarea rows="3" class="form-control commandArea" id="commandArea" th:text="${command}"
              readonly></textarea>
          </div>
        </div>

        <div class="form-group">
          <div class="d-flex mb-2">
            <label class="h5">お気に入り</label>
          </div>
          <div id="favArea">
          </div>
        </div>

        <div class="form-group">
          <div class="h5">ヘルプ</div>
          <ul class="nav nav-tabs mb-3" id="nav-tab" role="tablist">
            <li class="nav-item" role="presentation">
              <button type="button" class="nav-link active" id="nav-description-tab" data-bs-toggle="tab"
                data-bs-target="#nav-description" role="tab" aria-controls="nav-description"
                aria-selected="true">説明</button>
            </li>
            <li class="nav-item" role="presentation">
              <button type="button" class="nav-link" id="nav-qa-tab" data-bs-toggle="tab" data-bs-target="#nav-qa"
                role="tab" aria-controls="nav-qa" aria-selected="false">Q＆A</button>
            </li>
          </ul>

          <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane show active" id="nav-description" role="tabpanel" aria-labelledby="nav-description-tab"
              tabindex="0">
              <div>twitterのコマンドを生成するサイトです。</div>
              <div>このサイトで生成したコマンドをtwitterの検索欄にペーストして検索するだけで、条件に合致する投稿が表示されます。</div>
            </div>
            <div class="tab-pane" id="nav-qa" role="tabpanel" aria-labelledby="nav-qa-tab" tabindex="0">
              <div class="h6">Q.エラーが出てしまい、コマンドが生成されない</div>
              <div>特にアンダーバー（_）が全角になっていないか</div>
            </div>
          </div>
        </div>
  </form>


  <script>
    // ページ読み込み時にお気に入り一覧を取得
    document.addEventListener("DOMContentLoaded", () => {
      const favCommands = localStorage.getItem("favCommand");
      const favCommand = document.createElement("div");
      favCommand.textContent = favCommands;

      const parent = document.getElementById("favArea");
      parent.appendChild(favCommand);
    });

    // 生成条件をリセットするボタン
    const resetButton = document.getElementById("resetButton");
    resetButton.addEventListener("click", () => {
      const inputFields = document.querySelectorAll("[data-reset]");
      inputFields.forEach(inputField => {
        inputField.value = ''
      });
      const checkboxs = document.getElementsByClassName("form-check-input");
      Array.from(checkboxs).forEach(checkbox => {
        checkbox.checked = false;
      });
    });

    // コマンドをコピーするボタン
    const copyButton = document.getElementById("copyButton");
    copyButton.addEventListener("click", () => {
      const copyText = document.getElementById("commandArea");
      copyText.select();
      document.execCommand("copy");
      alert("コマンドをコピーしました！");
    });

    // コマンドをお気に入り登録するボタン
    const favButton = document.getElementById("favButton");
    favButton.addEventListener("click", () => {
      const createdCommand = document.getElementById("commandArea").value;

      const favCommand = document.createElement("div");
      favCommand.textContent = createdCommand;

      const parent = document.getElementById("favArea");
      parent.appendChild(favCommand);

      localStorage.setItem("favCommand", createdCommand);

      alert("コマンドをお気に入り登録しました！");
    });

  </script>
</body>

</html>
