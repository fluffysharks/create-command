<!DOCTYPE html>
<html lang="java">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> -->
  <link href="../css/bootstrapv538.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <title>Twitter(X)検索コマンド生成</title>
</head>

<body>
  <style>
    .container {
      width: 70%;
    }

    .form-group {
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .form-check {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    label {
      white-space: nowrap;
    }

    .validation {
      font-size: 80%;
      color: gray;
      margin-bottom: 8px;
      line-height: 1;
    }

    .subhead {
      padding: 0.2rem 0.5rem;
      border-left: 6px solid #0d6efd;
    }

    .fa-exclamation {
      color: #DC3545;
    }

    button {
      align-self: center;

    }

    .favList {
      align-items: center;
    }

    .noteButton {
      width: 1.3rem;
      height: 1.3rem;
    }

    @media (max-width:576px) {
      .container {
        width: 90%;
      }
    }
  </style>

  <div class="d-flex justify-content-center">
    <span class="pageTitle h1 mt-2 mb-4">Twitter(X)検索コマンド生成</span>
  </div>


  <form th:action="@{/createTwitterCommand}" th:object="${form}" method="post">
    <div class="container">
      <div class="form-group">
        <ul class="nav nav-underline justify-content-center mb-3" id="nav-tab" role="tablist">
          <li class="nav-item" role="presentation">
            <button type="button" class="nav-link active" id="create-tab" data-bs-toggle="pill"
              data-bs-target="#nav-create" role="tab" aria-controls="nav-create" aria-selected="true">新規作成</button>
          </li>
          <li class="nav-item" role="presentation">
            <button type="button" class="nav-link" id="favorite-tab" data-bs-toggle="pill"
              data-bs-target="#nav-favorite" role="tab" aria-controls="nav-favorite"
              aria-selected="false">お気に入り</button>
          </li>
          <li class="nav-item" role="presentation">
            <button type="button" class="nav-link" id="help-tab" data-bs-toggle="pill" data-bs-target="#nav-help"
              role="tab" aria-controls="nav-help" aria-selected="false">ヘルプ</button>
          </li>
        </ul>

        <div class="tab-content" id="nav-tabContent">
          <div div class="tab-pane show active" id="nav-create" role="tabpanel" aria-labelledby="create-tab"
            tabindex="0">

            <div class="form-group row">
              <label class="userName col-form-label text-wrap">ユーザー名</label>
              <p class="validation">※半角英数字とアンダーバーのみ&nbsp;15文字以内</p>
              <div class="input-group">
                <span class="input-group-text" id="basic-addon1">@</span>
                <input type="text" placeholder="例）example_user" class="form-control"
                  th:classappend="${#fields.hasErrors('userName')}? 'is-invalid'" aria-describedby="basic-addon1"
                  th:field="*{userName}" data-reset>
                <div th:if="${#fields.hasErrors('userName')}" class="invalid-feedback">
                  <i class="fa-solid fa-exclamation"></i>
                  <span th:errors="*{userName}"></span>
                </div>
              </div>
            </div>

            <div class="form-group row">
              <label class="date col-form-label">期間</label>
              <div class="row">
                <div class="responsiveForm">
                  <input type="date" class="dateSince form-control"
                    th:classappend="${!#strings.isEmpty(compareDate)}? 'is-invalid'" th:field="*{dateSince}" data-reset>
                  <div th:if="${!#strings.isEmpty(compareDate)}" class="invalid-feedback">
                    <i class="fa-solid fa-exclamation"></i>
                    <span th:text="${compareDate}"></span>
                  </div>
                </div>
                <label class="date col-1 col-form-label text-center">～</label>
                <div class="responsiveForm">
                  <input type="date" class="dateUntil form-control" th:field="*{dateUntil}" data-reset>
                </div>
              </div>
            </div>

            <div class="form-group row">
              <label class="keyword  col-form-label text-wrap">キーワード（完全一致）</label>
              <div class="d-flex">
                <p class="validation">※20文字以内</p>
                <span class="ms-auto" id="counter1"></span>
              </div>
              <div>
                <input type="text" placeholder="例）美味しいランチ" class="form-control" id="keyword1"
                  th:classappend="${#fields.hasErrors('keyword')}? 'is-invalid'" th:field="*{keyword}" data-reset>
                <div th:if="${#fields.hasErrors('keyword')}" class="invalid-feedback">
                  <i class="fa-solid fa-exclamation"></i>
                  <span th:errors="*{keyword}"></span>
                </div>
              </div>
            </div>

            <div class="form-check form-switch mb-3">
              <input type="checkbox" role="switch" class="followee form-check-input" value="followee" th:id="followee"
                th:field="*{followee}" data-reset>
              <label class="form-check-label" for="followee">フォローしている人の投稿のみ表示</label>
            </div>

            <div class="form-check form-switch mb-3">
              <input type="checkbox" role="switch" class="pictures form-check-input" value="pictures" th:id="pictures"
                th:field="*{pictures}" data-reset>
              <label class="form-check-label" for="pictures">画像投稿のみ表示</label>
            </div>

            <div class="form-group">
              <div class="accordion" id="moreOption">
                <div class="accordion-item">
                  <h5 class="accordion-header">
                    <button class="accordion-button collapsed text-center" type="button" data-bs-toggle="collapse"
                      data-bs-target="#collapse" aria-expanded="false" aria-controls="collapse">
                      <i class="fa-solid fa-plus"></i>
                      <span>&nbsp;さらに条件を追加</span>
                    </button>
                  </h5>

                  <div id="collapse" class="accordion-collapse collapse" data-bs-parent="#moreOption">
                    <div class="accordion-body">
                      <div class="form-group row">
                        <label class="keyword col-form-label text-wrap">除外するキーワード（完全一致）</label>
                        <div class="d-flex">
                          <p class="validation">※20文字以内</p>
                          <span class="ms-auto" id="counter2"></span>
                        </div>
                        <div>
                          <input type="text" placeholder="例）5000円のランチ" class="form-control" id="keyword2"
                            th:classappend="${#fields.hasErrors('removeKeyword')}? 'is-invalid'"
                            th:field="*{removeKeyword}" data-reset>
                          <div th:if="${#fields.hasErrors('removeKeyword')}" class="invalid-feedback">
                            <i class="fa-solid fa-exclamation"></i>
                            <span th:errors="*{removeKeyword}"></span>
                          </div>
                        </div>
                      </div>

                      <div class="form-group row">
                        <label class="faves col-form-label">いいね数</label>
                        <p class="validation">※10億以下</p>
                        <div class="row">
                          <div class="responsiveForm">
                            <input type="number" min="0" class="minFaves form-control d-inline"
                              th:classappend="${!#strings.isEmpty(compareFaves)}? 'is-invalid'" th:field="*{minFaves}"
                              data-reset max="1000000000">
                            <div th:if="${!#strings.isEmpty(compareFaves)}" class="invalid-feedback">
                              <i class="fa-solid fa-exclamation"></i>
                              <span th:text="${compareFaves}"></span>
                            </div>
                          </div>
                          <label class="faves col-1 col-form-label text-center">～</label>
                          <div class="responsiveForm">
                            <input type="number" min="0" class="maxFaves form-control d-inline" th:field="*{maxFaves}"
                              data-reset max="1000000000">
                          </div>
                        </div>
                      </div>

                      <div class="form-group row">
                        <label class="userName col-form-label text-wrap">このユーザー宛ての返信</label>
                        <p class="validation">※半角英数字とアンダーバーのみ&nbsp;15文字以内</p>
                        <div class="input-group">
                          <span class="input-group-text" id="basic-addon2">@</span>
                          <input type="text" placeholder="例）to_this_user" class="form-control"
                            th:classappend="${#fields.hasErrors('reply')}? 'is-invalid'" aria-describedby="basic-addon2"
                            th:field="*{reply}" data-reset>
                          <div th:if="${#fields.hasErrors('reply')}" class="invalid-feedback">
                            <i class="fa-solid fa-exclamation"></i>
                            <span th:errors="*{reply}"></span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-group row mb-5">
                <input type="button" class="btn btn-outline-primary col-4 mx-auto" id="resetButton" value="条件をクリア">
                <input type="submit" class="btn btn-primary col-7 mx-auto" name="generateCommand" value="コマンドを生成">
              </div>

              <div class="form-group">
                <div class="d-flex mt-2 mb-1">
                  <label class="h5 subhead">結果</label>
                  <div class="ms-auto gap-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="favButton">
                      <i class="fa-solid fa-star"></i>
                      <span>お気に入り登録</span>
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="copyButton">
                      <i class="fa-solid fa-copy"></i>
                      <span>コピー</span>
                    </button>
                  </div>
                </div>
                <div>
                  <textarea rows="3" class="form-control commandArea mb-5" id="commandArea" th:text="${command}"
                    readonly></textarea>
                </div>
              </div>
            </div>
          </div>

          <div class="tab-pane" id="nav-favorite" role="tabpanel" aria-labelledby="favorite-tab" tabindex="0">
            <div class="form-group">
              <!-- <div class="d-flex mb-2">
                <div class="ms-auto d-flex gap-2">
                  <button type="button" class="btn btn-outline-danger btn-sm" id="delButton">
                    <i class="fa-solid fa-trash"></i>
                    <span>すべて削除</span>
                  </button>
                </div>
              </div> -->
              <ul class="list-group list-group-flush" id="favArea"></ul>
            </div>
          </div>

          <div class="tab-pane" id="nav-help" role="tabpanel" aria-labelledby="help-tab" tabindex="0">
            <div class="form-group">
              <!-- <div class="h4">説明</div>
              <div>twitterのコマンドを生成するサイトです。</div>
              <div>このサイトで生成したコマンドをtwitterの検索欄にペーストして検索するだけで、条件に合致する投稿が表示されます。</div>

              <div class="h4">QA</div>
              <div class="h6">Q.エラーが出てしまい、コマンドが生成されない</div>
              <div>特にアンダーバー（_）が全角になっていないか</div> -->

              <div class="mb-4">要望・バグ報告などは<a href="https://forms.gle/WLJueGioScScPbuz7" target="_blank">こちら</a>から</div>
              <div class="h5 subhead">リリースノート</div>
              <ul class="list-group list-group-flush">
                <li class="list-group-item border-dark-subtle d-flex">2026-1-11&nbsp;バグを修正しました。</li>
                <li class="list-group-item border-dark-subtle d-flex">2026-1-11&nbsp;バグを修正しました。</li>
              </ul>
              <div class="h5 subhead">今後の実装予定</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>


  <script>
    // TODO
    const favCommandList = JSON.parse(localStorage.getItem("favCommands")) || [];
    const favArea = document.getElementById("favArea");
    const favButton = document.getElementById("favButton");
    const counter1 = document.getElementById("counter1");
    const counter2 = document.getElementById("counter2");
    const keyword1 = document.getElementById("keyword1");
    const keyword2 = document.getElementById("keyword2");

    // お気に入り一覧を表示
    function displayFavCommands() {
      favArea.innerHTML = "";
      Array.from(favCommandList).forEach(favCommand => {

        //お気に入りを一列作る
        const favCommandElement = document.createElement("li");
        favCommandElement.className = "list-group-item border-dark-subtle d-flex favList";
        favArea.appendChild(favCommandElement);

        //バツボタン
        const favDelete = document.createElement("button");
        favDelete.className = "btn text-muted favDelete me-1";
        const deleteIcon = document.createElement("i");
        deleteIcon.className = "fa-solid fa-xmark";
        favDelete.appendChild(deleteIcon);
        favCommandElement.appendChild(favDelete);

        //コマンド本文
        const favText = document.createElement("span");
        favText.textContent = favCommand;
        favCommandElement.appendChild(favText);

        //備考ボタン
        const memo = document.createElement("button");
        memo.className = "btn btn-outline-secondary btn-sm rounded-circle p-0 ms-auto ms-2 me-2 noteButton";
        const memoIcon = document.createElement("i");
        memoIcon.className = "fa-solid fa-question";
        memo.appendChild(memoIcon);
        favCommandElement.appendChild(memo);

        //コピーボタン
        const favCopy = document.createElement("button");
        favCopy.className = "btn btn-outline-secondary btn-sm favCopy";
        const copyIcon = document.createElement("i");
        copyIcon.className = "fa-solid fa-copy";
        favCopy.appendChild(copyIcon);
        favCommandElement.appendChild(favCopy);
      })
    };

    // ページ読み込み時にお気に入りコマンド一覧を表示
    document.addEventListener("DOMContentLoaded", () => {
      displayFavCommands();
    });

    // コマンドをお気に入り登録するボタン
    favButton.addEventListener("click", () => {
      const createdCommand = document.getElementById("commandArea").value;
      const favMemo = doument.getElementById("favMemo").value
      if (createdCommand) {
        // favCommandList.push(createdCommand);
        // localStorage.setItem("favCommands", JSON.stringify(favCommandList));
        // displayFavCommands();

        // キー連番

        const favObject = {
          command: createdCommand,
          memo: favMemo
        };

        localStorage.setItem("key", JSON.stringify(favObject));

        alert("コマンドをお気に入り登録しました！");
      } else {
        alert("1文字以上のコマンドを生成してください");
      }
    });

    // // お気に入りをすべて削除
    // const del = document.getElementById("delButton");
    // del.addEventListener("click", () => {
    //   localStorage.clear();
    //   displayFavCommands();
    // });

    //　文字数カウンター
    keyword1.addEventListener("input", () => {
      counter1.innerHTML = keyword1.value.length + "/20";
    });

    keyword2.addEventListener("input", () => {
      counter2.innerHTML = keyword2.value.length + "/20";
    });


    // 生成条件をリセットするボタン
    const resetButton = document.getElementById("resetButton");
    resetButton.addEventListener("click", () => {
      const inputFields = document.querySelectorAll("[data-reset]");
      inputFields.forEach(inputField => {
        inputField.value = ''
      });
      const checkboxs = document.getElementsByClassName("form-check-input");
      Array.from(checkboxs).forEach(checkbox => {
        checkbox.checked = false;
      });
    });

    // コマンドをコピーするボタン
    const copyButton = document.getElementById("copyButton");
    copyButton.addEventListener("click", () => {
      const copyText = document.getElementById("commandArea");
      copyText.select();
      document.execCommand("copy");
      alert("コマンドをコピーしました！");
    });

    //　レスポンシブデザイン
    const mediaSize = window.matchMedia("max-width:576px");
    const responsiveForms = document.querySelectorAll(".responsiveForm");

    function responsiveDesign() {
      if (mediaSize.matches) {
        responsiveForms.forEach(form => {
          form.classList.add("col-3");
        });

      } else {
        responsiveForms.forEach(form => {
          form.classList.add("col-5");
        });
      }
    }
    mediaSize.addEventListener("change", responsiveDesign);
    responsiveDesign();
  </script>
</body>

</html>
